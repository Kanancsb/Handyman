spring.application.name=demo
logging.file.name=${HANDYMAN_LOG_FILE:logs/handyman.log}
handyman.youtube.downloader.binary=yt-dlp
handyman.youtube.downloader.js-runtime=node
handyman.youtube.downloader.timeout=2h
handyman.youtube.downloader.prepared-download-ttl=30m
handyman.spotify.client-id=${SPOTIFY_CLIENT_ID:}
handyman.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}
handyman.spotify.redirect-uri=${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/callback}
handyman.spotify.youtube-results=3
handyman.spotify.max-tracks=200
handyman.spotify.matching-concurrency=4
handyman.spotify.search-timeout=45s
